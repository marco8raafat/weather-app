
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app
spec:
  replicas: 3                # Prod runs 3 pods for higher availability/load capacity
  template:
    spec:
      containers:
        - name: weather-app
          resources:
            requests:
              cpu: "200m"             # Higher guaranteed CPU than base (100m)
              memory: "256Mi"         # Higher guaranteed memory than base (128Mi)
            limits:
              cpu: "1000m"            # Higher CPU cap than base (500m) — full 1 core
              memory: "1Gi"           # Higher memory cap than base (512Mi)