---
- name: Initialize cluster with kubeadm
  ansible.builtin.command:
    cmd: "kubeadm init --pod-network-cidr={{ kube_pod_network_cidr }}"
  register: kubeadm_init_output
  args:
    creates: "{{ kubeadm_admin_conf }}"

- name: Set up kubeconfig for {{ kubeconfig_user }}
  ansible.builtin.shell: |
    mkdir -p {{ kubeconfig_home }}/.kube
    cp -i {{ kubeadm_admin_conf }} {{ kubeconfig_home }}/.kube/config
    chown {{ kubeconfig_user }}:{{ kubeconfig_user }} {{ kubeconfig_home }}/.kube/config
  args:
    creates: "{{ kubeconfig_home }}/.kube/config"

- name: Install Calico pod network
  ansible.builtin.command:
    cmd: "kubectl apply -f {{ calico_manifest_url }}"
  become_user: "{{ kubeconfig_user }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_home }}/.kube/config"

- name: Generate join command
  ansible.builtin.command:
    cmd: kubeadm token create --print-join-command
  register: join_command

- name: Save join command to a file
  ansible.builtin.copy:
    content: "{{ join_command.stdout }}"
    dest: "{{ join_command_path }}"
