
# =========================================================
# PLAY A - Common setup, runs on ALL nodes (master + workers)
# =========================================================
- name: Common setup for all Kubernetes nodes
  hosts: kubernetes
  become: true
  tasks:

    - name: Disable swap
      command: swapoff -a
      changed_when: false

    - name: Remove swap entry from /etc/fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Load required kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Persist kernel modules on boot
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Set required sysctl params for Kubernetes networking
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1

    - name: Apply sysctl params
      command: sysctl --system
      changed_when: false

    - name: Install containerd and dependencies
      apt:
        name:
          - containerd
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Create containerd config directory
      file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Generate default containerd config
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Enable SystemdCgroup in containerd config
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup\s*=\s*false'
        replace: 'SystemdCgroup = true'

    - name: Restart and enable containerd
      systemd:
        name: containerd
        state: restarted
        enabled: true

    - name: Add Kubernetes apt signing key
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: '0644'

    - name: Add Kubernetes apt repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /"
        state: present
        filename: kubernetes

    - name: Install kubelet, kubeadm, kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Hold Kubernetes packages at current version
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl


# =========================================================
# PLAY B - Initialize the cluster, MASTER only
# =========================================================
- name: Initialize Kubernetes cluster on master
  hosts: master
  become: true
  tasks:

    - name: Initialize cluster with kubeadm
      command: kubeadm init --pod-network-cidr=192.168.0.0/16
      register: kubeadm_init_output
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Set up kubeconfig for ubuntu user
      shell: |
        mkdir -p /home/ubuntu/.kube
        cp -i /etc/kubernetes/admin.conf /home/ubuntu/.kube/config
        chown ubuntu:ubuntu /home/ubuntu/.kube/config
      args:
        creates: /home/ubuntu/.kube/config

    - name: Install Calico pod network
      become_user: ubuntu
      command: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config

    - name: Generate join command
      command: kubeadm token create --print-join-command
      register: join_command

    - name: Save join command to a file
      copy:
        content: "{{ join_command.stdout }}"
        dest: /tmp/join-command.sh


# =========================================================
# PLAY C - Join worker nodes to the cluster
# =========================================================
- name: Join worker nodes to the cluster
  hosts: workers
  become: true
  tasks:

    - name: Fetch join command from master
      run_once: true
      delegate_to: "{{ groups['master'][0] }}"
      fetch:
        src: /tmp/join-command.sh
        dest: /tmp/join-command.sh
        flat: true

    - name: Copy join command to workers
      copy:
        src: /tmp/join-command.sh
        dest: /tmp/join-command.sh
        mode: '0755'

    - name: Run kubeadm join
      command: sh /tmp/join-command.sh
      args:
        creates: /etc/kubernetes/kubelet.conf


# =========================================================
# PLAY D - Install NGINX Ingress Controller using Helm
# RUN FROM MASTER AFTER WORKERS HAVE JOINED
# =========================================================

- name: Install NGINX Ingress Controller
  hosts: master
  become: true
  become_user: ubuntu
  gather_facts: true

  environment:
    KUBECONFIG: /home/ubuntu/.kube/config

  tasks:

    # ==========================================================
    # 1. Check Kubernetes access
    # ==========================================================

    - name: Check Kubernetes cluster
      ansible.builtin.command:
        cmd: kubectl get nodes
      register: kubectl_nodes
      changed_when: false

    - name: Display Kubernetes nodes
      ansible.builtin.debug:
        var: kubectl_nodes.stdout_lines


    # ==========================================================
    # 2. Install Helm
    # ==========================================================

    - name: Download Helm installation script
      become_user: root
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get_helm.sh
        mode: '0755'

    - name: Install Helm
      become_user: root
      ansible.builtin.command:
        cmd: /tmp/get_helm.sh
      args:
        creates: /usr/local/bin/helm

    - name: Verify Helm installation
      become_user: root
      ansible.builtin.command:
        cmd: /usr/local/bin/helm version
      register: helm_version
      changed_when: false

    - name: Display Helm version
      ansible.builtin.debug:
        var: helm_version.stdout


    # ==========================================================
    # 3. Add NGINX Ingress Helm repository
    # ==========================================================

    - name: Add ingress-nginx Helm repository
      ansible.builtin.command:
        cmd: /usr/local/bin/helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
      register: helm_repo
      changed_when: >
        'already exists' not in (helm_repo.stdout | lower)
        and 'already exists' not in (helm_repo.stderr | lower)


    # ==========================================================
    # 4. Update Helm repositories
    # ==========================================================

    - name: Update Helm repositories
      ansible.builtin.command:
        cmd: /usr/local/bin/helm repo update
      changed_when: false


    # ==========================================================
    # 5. Install NGINX Ingress Controller
    # ==========================================================

    - name: Install NGINX Ingress Controller
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/helm upgrade --install ingress-nginx
          ingress-nginx/ingress-nginx
          --namespace ingress-nginx
          --create-namespace
      register: ingress_install

    - name: Display ingress installation result
      ansible.builtin.debug:
        var: ingress_install.stdout_lines


    # ==========================================================
    # 6. Wait for Ingress Controller
    # ==========================================================

    - name: Wait for NGINX Ingress Controller
      ansible.builtin.command:
        cmd: >
          kubectl rollout status
          deployment/ingress-nginx-controller
          -n ingress-nginx
          --timeout=300s
      changed_when: false


    # ==========================================================
    # 7. Verify Ingress Controller Pods
    # ==========================================================

    - name: Get ingress-nginx pods
      ansible.builtin.command:
        cmd: kubectl get pods -n ingress-nginx -o wide
      register: ingress_pods
      changed_when: false

    - name: Display ingress-nginx pods
      ansible.builtin.debug:
        var: ingress_pods.stdout_lines


    # ==========================================================
    # 8. Verify Ingress Controller Service
    # ==========================================================

    - name: Get ingress-nginx services
      ansible.builtin.command:
        cmd: kubectl get svc -n ingress-nginx
      register: ingress_services
      changed_when: false

    - name: Display ingress-nginx services
      ansible.builtin.debug:
        var: ingress_services.stdout_lines


    # ==========================================================
    # 9. Verify IngressClass
    # ==========================================================

    - name: Get IngressClass
      ansible.builtin.command:
        cmd: kubectl get ingressclass
      register: ingress_class
      changed_when: false

    - name: Display IngressClass
      ansible.builtin.debug:
        var: ingress_class.stdout_lines