---
kernel_modules:
  - overlay
  - br_netfilter

sysctl_settings:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1

common_packages:
  - containerd
  - ca-certificates
  - curl
  - gnupg

containerd_config_dir: /etc/containerd
containerd_config_file: /etc/containerd/config.toml
containerd_config_default_command: containerd config default > /etc/containerd/config.toml
containerd_service: containerd

kubernetes_apt_key_url: https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key
kubernetes_apt_key_dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
kubernetes_apt_repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /"
kubernetes_packages:
  - kubelet
  - kubeadm
  - kubectl
